on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Read local package version
        id: read-local-version
        run: |
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Read published package version
        id: read-published-version
        run: |
          PKG_NAME=$(jq -r .name package.json)
          version=$(pnpm view $PKG_NAME version --registry https://npm.pkg.github.com 2>/dev/null || echo "")
          echo "version=$version" >> $GITHUB_OUTPUT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install, pack, and publish
        if: ${{ steps.read-local-version.outputs.version != steps.read-published-version.outputs.version }}
        id: publish
        run: |
          pnpm install
          tarball=$(pnpm pack --out package.tgz | tail -n 1)
          pnpm config set //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          pnpm publish $tarball
          echo "tarball=$tarball" >> $GITHUB_OUTPUT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: ${{ steps.read-local-version.outputs.version != steps.read-published-version.outputs.version }}
        with:
          target_commitish: ${{ github.sha }}
          tag_name: v${{ steps.read-local-version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            ${{ steps.publish.outputs.tarball }}
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read local package version
        id: read-local-version
        run: |
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.read-local-version.outputs.version }},enable={{is_default_branch}}

      - name: Prune files
        run: bash scripts/prune.sh

      - name: Bake and push Docker image
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          push: true
          source: .
          targets: pandvil-gha
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-tags }}
            ${{ steps.meta.outputs.bake-file-labels }}
          set: |
            *.platform=linux/amd64,linux/arm64
